name: Solidity prototype
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/solidity.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/solidity.yml'
jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run Solidity tests
        working-directory: contracts
        run: forge test -vv
