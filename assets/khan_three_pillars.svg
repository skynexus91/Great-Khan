<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#0e182b"/><text x="75" y="100" font-size="49" fill="#f4d08b" font-family="Arial" font-weight="bold">THE GREAT KHAN</text><text x="75" y="145" font-size="25" fill="white" font-family="Arial">Three pillars of net distributable protocol revenue</text><rect x="80" y="250" width="416" height="160" rx="14" fill="#b78a42"/><rect x="496" y="250" width="312" height="160" fill="#167b9c"/><rect x="808" y="250" width="312" height="160" rx="14" fill="#3b9469"/><g fill="white" font-family="Arial" text-anchor="middle"><text x="288" y="320" font-size="56">40%</text><text x="288" y="365" font-size="28">KHAN Commons</text><text x="652" y="320" font-size="56">30%</text><text x="652" y="365" font-size="28">People</text><text x="964" y="320" font-size="56">30%</text><text x="964" y="365" font-size="28">Businesses</text></g><text x="80" y="510" font-size="25" fill="#e6eaf0" font-family="Arial">Transparent policy proposal • Simulated economy • Human-reviewed governance</text><text x="80" y="566" font-size="20" fill="#c3cad7" font-family="Arial">Not a distribution of deposits, locked reserves or customer balances.</text><text x="80" y="613" font-size="20" fill="#c3cad7" font-family="Arial">CONCEPT / NO LIVE TOKEN / NO INVESTMENT RETURNS</text></svg>